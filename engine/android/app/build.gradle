// Per-game Quest APK module (template).
//
// @PTV_*@ tokens are substituted by the orchestrator's quest_build stage
// (stage_quest_build.py) when it instantiates this template into a project's
// build dir. Do not hand-edit the instantiated copy.
plugins {
    id 'com.android.application'
}

android {
    namespace '@PTV_PACKAGE@'
    compileSdk @PTV_COMPILE_SDK@
    // Pin the NDK so the externalNativeBuild is deterministic (substituted from
    // Settings.android_ndk_version). Must be installed under $ANDROID_HOME/ndk.
    ndkVersion '@PTV_NDK_VERSION@'

    defaultConfig {
        applicationId '@PTV_PACKAGE@'
        minSdk @PTV_MIN_SDK@
        targetSdk @PTV_TARGET_SDK@
        versionCode 1
        versionName '1.0'

        ndk {
            // Quest 3 is arm64 only. Shipping one ABI keeps the APK small and
            // the build fast.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DPTV_ENGINE_DIR=@PTV_ENGINE_DIR@',
                          '-DPTV_PROJECT_ID=@PTV_PROJECT_ID@',
                          '-DPTV_GENERATED_EXTRA_SOURCES=@PTV_GENERATED_EXTRA_SOURCES@',
                          '-DPTV_APP_LIB_NAME=ptv_quest'
                cppFlags '-std=c++20'
            }
        }
    }

    // The Khronos OpenXR Android loader is delivered as an AAR containing a
    // native Prefab package; CMake picks it up via find_package(OpenXR).
    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1+'

            // Relocate the .cxx tree to a SHORT absolute path.
            //
            // Windows still enforces MAX_PATH (260) in ninja, and the default
            // location is already about 104 characters deep before CMake adds
            // anything:
            //   <repo>/projects/<project-id>/builds/quest/app/.cxx/
            // FetchContent then appends its own
            //   <config>/<hash>/<abi>/_deps/<pkg>-subbuild/<pkg>-populate-prefix/
            //   src/<pkg>-populate-stamp/<pkg>-populate-install
            // which lands at roughly 250 characters for 'Debug'. Renaming the
            // config to 'RelWithDebInfo' added nine characters and pushed
            // nlohmann_json's stamp file over the limit, failing configure
            // with "Filename longer than 260 characters".
            //
            // Project ids are timestamped and long, so this has no headroom
            // by default. A short staging dir buys back ~85 characters and
            // makes the build independent of how deep the project lives.
            buildStagingDirectory '@PTV_CXX_DIR@'
        }
    }

    // Debug builds are auto-signed with the SDK debug key -> installable via
    // adb with no manual signing. Release signing/store submission is out of
    // scope for local testing.
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true

            // The APK is debug-signed, but the ENGINE is compiled optimized.
            //
            // AGP otherwise configures CMake as Debug for this build type,
            // which is -O0 for the whole renderer, physics, skinning and
            // scene load. A Quest 3 has to present stereo at 72-90 Hz, and
            // unoptimized native code does not get close -- the APK installs
            // and launches and is still unplayable.
            //
            // RelWithDebInfo keeps -g, so a tombstone still symbolizes, and
            // it also compiles out Jolt's asserts (JPH_ENABLE_ASSERTS is tied
            // to JPH_DEBUG). Those asserts are breakpoints, i.e. SIGTRAP on
            // device: a bad mass in a generated scene used to kill the
            // process during load with nothing reported. The engine-side
            // guards and the Jolt assert handler cover the debug desktop
            // build; this makes the shipped APK immune by construction.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Meta requires the Khronos OpenXR Android loader >= 1.0.34.
    implementation 'org.khronos.openxr:openxr_loader_for_android:@PTV_LOADER_VERSION@'
}

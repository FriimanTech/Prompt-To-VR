[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptv-orchestrator"
version = "0.1.0"
description = "Local FastAPI orchestrator for Prompt-To-Native-VR."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sse-starlette>=1.8",
    "anyio>=4",
    "ptv-schemas",
    "ptv-provider-clients",
    # OpenAI Agents SDK powers the multi-agent code-generation stage.
    # Verified against https://openai.github.io/openai-agents-python/
    # (Apr/May 2026). The SDK ships the hosted ``WebSearchTool`` and
    # Pydantic-typed structured outputs used by ``codegen_agent.py``.
    "openai-agents>=0.17,<1.0",
    # socket_generation: triangle-id back-projection, region PCA and the
    # per-kind socket solvers work on whole meshes and 768x768 id buffers.
    "numpy>=2.0",
    # socket_generation rasterises Gemini's mask polygons and reads renders.
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptv_orchestrator*"]

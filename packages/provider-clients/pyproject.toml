[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptv-provider-clients"
version = "0.1.0"
description = "Anthropic, Google GenAI, and Tripo wrappers used by the Prompt-To-Native-VR orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=1.0",
    # Tripo is called over plain HTTP against the V3 API rather than through
    # the official ``tripo3d`` SDK: that SDK's primary BASE_URL is still
    # ``api.tripo3d.ai/v2/openapi`` and only file upload / task query /
    # mesh-segment reach V3, so every generation call would keep running on
    # V2 (retired 2026-11-01). ``aiohttp`` went with it -- it existed solely
    # because the SDK's async paths required it.
    "httpx>=0.27",
    # Uthana: humanoid auto-rig with fingers + locomotion motions. 0.5.1 is
    # the first release with in_place / no_mesh motion downloads.
    "uthana>=0.5.1",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "pydantic>=2.7",
    "ptv-schemas",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptv_providers*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptv-provider-clients"
version = "0.1.0"
description = "Anthropic, Google GenAI, and Tripo wrappers used by the Prompt-To-Native-VR orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=1.0",
    "tripo3d>=0.1",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.7",
    "ptv-schemas",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptv_providers*"]

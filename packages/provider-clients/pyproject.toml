[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptv-provider-clients"
version = "0.1.0"
description = "Anthropic, Google GenAI, and Tripo wrappers used by the Prompt-To-Native-VR orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=1.0",
    # Tripo's Python SDK lists aiohttp as an OPTIONAL dep on PyPI even though
    # every async path (image upload, polling, download) requires it, so we
    # pin aiohttp explicitly here to guarantee it is installed alongside
    # tripo3d. Without this the Tripo stage fails at runtime with
    # ``ModuleNotFoundError: No module named 'aiohttp'``.
    "tripo3d>=0.3.9",
    "aiohttp>=3.8.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.7",
    "ptv-schemas",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptv_providers*"]
